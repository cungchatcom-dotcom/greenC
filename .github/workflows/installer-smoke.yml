name: Installer Upgrade Smoke Test

# Installs an older public release, upgrades it in place and checks that the desktop app starts.
on:
  workflow_dispatch:
    inputs:
      from:
        default: '2.1.2'
      to:
        default: '2.2.0'
  push:
    branches: ['test/installer-smoke']

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FROM: ${{ inputs.from || '2.1.2' }}
      TO: ${{ inputs.to || '2.2.0' }}
    steps:
      - name: Upgrade and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/cungchatcom-dotcom/greenC/releases/download'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F1C2B7A-3E4D-4C5B-9A8E-7D2F1B0C9E51}_is1'
          function Install-GreenC($v) {
            $exe = "$env:RUNNER_TEMP\GreenC-Setup-$v.exe"
            Invoke-WebRequest "$base/v$v/GreenC-Setup-$v.exe" -OutFile $exe
            $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
            if (-not $p.WaitForExit(180000)) { throw "installer $v did not finish" }
            if ($p.ExitCode -ne 0) { throw "installer $v exit $($p.ExitCode)" }
            $r = Get-ItemProperty $key
            if ($r.DisplayVersion -ne $v) { throw "registered version $($r.DisplayVersion), expected $v" }
            return $r.InstallLocation
          }
          function Start-App($dir, $v) {
            Get-Process GreenC -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $p = Start-Process (Join-Path $dir 'GreenC.exe') -PassThru
            Start-Sleep 25
            $p.Refresh()
            if ($p.HasExited) { throw "GreenC $v exited with code $($p.ExitCode)" }
            $web = (Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Measure-Object).Count
            Write-Output "::notice::GreenC $v running responding=$($p.Responding) title='$($p.MainWindowTitle)' webview_processes=$web"
            if (-not $p.Responding -or $web -eq 0) { throw "GreenC $v has no working window" }
          }
          try {
            $dir = Install-GreenC $env:FROM
            Start-App $dir $env:FROM
            $db = Get-ChildItem $env:LOCALAPPDATA,$env:APPDATA -Recurse -Filter 'greenc.db' -ErrorAction SilentlyContinue | Select-Object -First 1
            Write-Output "::notice::database after $($env:FROM): $([bool]$db)"
            try { $null = Install-GreenC $env:TO; Write-Output "::notice::silent upgrade while running: ok" }
            catch { Write-Output "::warning::silent upgrade while running: $($_.Exception.Message)" }
            Get-Process GreenC -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 3
            $dir = Install-GreenC $env:TO
            Start-App $dir $env:TO
            $out = & (Join-Path $dir 'greenc-cli.exe') zalo status --json 2>&1 | Out-String
            Write-Output "::notice::cli zalo status exit=$LASTEXITCODE $(($out -replace '\s+',' ').Substring(0,[Math]::Min(200,($out -replace '\s+',' ').Length)))"
            if ($LASTEXITCODE -ne 0) { throw 'zalo status failed' }
            Get-Process GreenC -ErrorAction SilentlyContinue | Stop-Process -Force
            $sch = & (Join-Path $dir 'greenc-cli.exe') doctor 2>&1 | Out-String
            Write-Output $sch
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            exit 1
          }
          exit 0
