name: GreenC v2 CI & Release Pipeline

permissions:
  contents: write

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      msix_version:
        description: 'Optional MSIX version override (a.b.c or a.b.c.0; defaults to Cargo.toml)'
        required: false
        default: ''

jobs:
  quality-gate:
    name: Rust & UI Quality Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm --dir ui install --no-frozen-lockfile

      - name: Build Frontend Assets
        run: pnpm --dir ui run build

      - name: Verify Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --keep-going --message-format short -- -D warnings 2>&1 | tee clippy.log; then
            grep -E "(error|warning)(\[|:)" clippy.log | grep -v "could not compile" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Verify Workspace Compilation
        run: cargo check --workspace --all-targets

      - name: Validate 50 Localization Catalogs
        run: cargo run -p greenc-i18n -- check

      - name: Run Workspace Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            grep -A3 -E "panicked at|^error(\[|:)" test.log | grep -vE "^--|RUST_BACKTRACE" | head -9 | cut -c1-900 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^test .*FAILED" test.log | head -9 | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi

      - name: Run Clippy Lints (Windows Store Feature)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo clippy \
            -p greenc-core -p greenc-platform -p greenc-storage \
            -p greenc-vault -p greenc-relocate -p greenc-cli -p greenc-app \
            --all-targets --features store --keep-going --message-format short -- -D warnings 2>&1 | tee clippy-store.log; then
            grep -E "(error|warning)(\[|:)" clippy-store.log | grep -v "could not compile" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Run Tests (Windows Store Feature)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo test \
            -p greenc-core -p greenc-platform -p greenc-storage \
            -p greenc-vault -p greenc-relocate -p greenc-cli -p greenc-app \
            --features store --no-fail-fast 2>&1 | tee test-store.log; then
            grep -A2 -E "panicked at|^error(\[|:)" test-store.log | grep -vE "^--|RUST_BACKTRACE" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "^test .*FAILED" test-store.log | head -9 | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi

  build-msix:
    name: Build Microsoft Store MSIX Package (${{ matrix.arch }})
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/microsoft-store' || github.ref == 'refs/heads/feat/store-arm64' || (startsWith(github.ref, 'refs/tags/v') && (vars.STORE_IDENTITY_NAME || vars.PACKAGEIDENTITYNAME) != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add Rust Target (${{ matrix.target }})
        run: rustup target add ${{ matrix.target }}

      - name: Setup Arm64 Native Build Toolchain (clang-cl & MSVC ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # Native dependency requirements for aarch64-pc-windows-msvc:
          # - aws-lc-sys 0.47.0 (reqwest -> rustls) compiles win-aarch64 .S assembly via clang-cl.
          # - ring 0.17.14 (if compiled) invokes clang on Windows AArch64.
          # - libsqlite3-sys 0.30.1 (rusqlite bundled) & zstd-sys 2.1.3 compile via MSVC ARM64 cl.exe.
          # - webview2-com-sys 0.39.1 bundles prebuilt arm64/WebView2LoaderStatic.lib.
          $vsInstalls = @()
          if (-not [string]::IsNullOrWhiteSpace(${env:ProgramFiles(x86)})) {
            $vswhere = Join-Path (Join-Path (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio') 'Installer') 'vswhere.exe'
            if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
              $foundVs = @(& $vswhere -all -products * -property installationPath)
              if ($LASTEXITCODE -eq 0) {
                $vsInstalls = @($foundVs | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              }
            }
          }

          function Find-ClangCl {
            $cmd = Get-Command clang-cl.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $cmd) {
              return $cmd.Source
            }

            $candidates = @()
            foreach ($base in @(${env:ProgramFiles}, ${env:ProgramFiles(x86)})) {
              if (-not [string]::IsNullOrWhiteSpace($base)) {
                $candidates += (Join-Path (Join-Path (Join-Path $base 'LLVM') 'bin') 'clang-cl.exe')
              }
            }
            foreach ($vsRoot in $vsInstalls) {
              $llvmBase = Join-Path (Join-Path (Join-Path $vsRoot 'VC') 'Tools') 'Llvm'
              foreach ($archDir in @('ARM64', 'x64', '')) {
                $binDir = if ([string]::IsNullOrWhiteSpace($archDir)) {
                  Join-Path $llvmBase 'bin'
                } else {
                  Join-Path (Join-Path $llvmBase $archDir) 'bin'
                }
                $candidates += (Join-Path $binDir 'clang-cl.exe')
              }
            }

            foreach ($cand in $candidates) {
              if (Test-Path -LiteralPath $cand -PathType Leaf) {
                return $cand
              }
            }
            return $null
          }

          $clangCl = Find-ClangCl
          if ([string]::IsNullOrWhiteSpace($clangCl)) {
            Write-Host 'clang-cl.exe not pre-installed in PATH or Visual Studio; installing LLVM...'
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $winget) {
              & $winget.Source install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements
              if ($LASTEXITCODE -ne 0) {
                throw "winget install LLVM.LLVM failed with exit code $LASTEXITCODE"
              }
            } elseif ($null -ne $choco) {
              & $choco.Source install llvm -y --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "choco install llvm failed with exit code $LASTEXITCODE"
              }
            } else {
              throw 'clang-cl.exe is missing and neither winget nor choco is available to install LLVM.'
            }
            $clangCl = Find-ClangCl
          }

          if ([string]::IsNullOrWhiteSpace($clangCl)) {
            throw 'clang-cl.exe not found after LLVM setup (required by aws-lc-sys on aarch64-pc-windows-msvc).'
          }

          $llvmBin = Split-Path -Path $clangCl -Parent
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $llvmBin
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AWS_LC_SYS_CC=$clangCl"

          Write-Host "Using clang-cl for aws-lc-sys: $clangCl"
          & $clangCl --version
          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl --version failed with exit code $LASTEXITCODE"
          }

          $clangExe = Join-Path $llvmBin 'clang.exe'
          if (Test-Path -LiteralPath $clangExe -PathType Leaf) {
            & $clangExe --version
            if ($LASTEXITCODE -ne 0) {
              throw "clang --version failed with exit code $LASTEXITCODE"
            }
          }

          # Verify MSVC ARM64 cl.exe is installed for libsqlite3-sys and zstd-sys
          $arm64Cl = @()
          foreach ($vsRoot in $vsInstalls) {
            $msvcDir = Join-Path (Join-Path (Join-Path $vsRoot 'VC') 'Tools') 'MSVC'
            if (Test-Path -LiteralPath $msvcDir -PathType Container) {
              $arm64Cl += @(Get-ChildItem -LiteralPath $msvcDir -Filter 'cl.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\arm64\\cl\.exe$' })
            }
          }
          if ($arm64Cl.Count -eq 0) {
            throw 'MSVC ARM64 cl.exe not found in Visual Studio installations (required by libsqlite3-sys and zstd-sys).'
          }
          Write-Host "Verified MSVC ARM64 cl.exe: $($arm64Cl[0].FullName)"

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msix-${{ matrix.arch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm --dir ui install --no-frozen-lockfile

      - name: Build Frontend Assets
        run: pnpm --dir ui run build

      - name: Run Tests (Windows Store Feature, Arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test `
            --target ${{ matrix.target }} `
            -p greenc-core -p greenc-platform -p greenc-storage `
            -p greenc-vault -p greenc-relocate -p greenc-cli -p greenc-app `
            --features store --no-fail-fast
          if ($LASTEXITCODE -ne 0) {
            throw "Arm64 store tests failed with exit code $LASTEXITCODE"
          }

      - name: Build Store Binaries (--features store)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --target ${{ matrix.target }} -p greenc-app -p greenc-cli --features store
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build (${{ matrix.target }}) failed with exit code $LASTEXITCODE"
          }

      - name: Package MSIX (${{ matrix.arch }})
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME || vars.PACKAGEIDENTITYNAME }}
          STORE_IDENTITY_PUBLISHER: ${{ vars.STORE_IDENTITY_PUBLISHER || vars.PACKAGEIDENTITYPUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME || vars.PACKAGEPROPERTIESPUBLISHERDISPLAYNAME }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ver = "${{ inputs.msix_version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -and "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          $params = @{
            Architecture = "${{ matrix.arch }}"
            RunWack      = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($ver)) {
            $params.Version = $ver
          }
          & packaging/msix/build-msix.ps1 @params

      - name: Install and smoke-test the package (${{ matrix.arch }}, self-signed, throwaway runner)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $msix = @(Get-ChildItem -Path dist/msix -Filter "GreenC-*-${{ matrix.arch }}.msix" -File)
          if ($msix.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.arch }} .msix in dist/msix, found $($msix.Count)"
          }
          & packaging/msix/smoke-test.ps1 -PackagePath $msix[0].FullName -ExpectedArchitecture "${{ matrix.arch }}"

      - name: Report package identity (${{ matrix.arch }})
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $x = [xml](Get-Content -LiteralPath "dist/msix/stage-${{ matrix.arch }}/AppxManifest.xml" -Raw -Encoding UTF8)
          $msix = @(Get-ChildItem -Path dist/msix -Filter "GreenC-*-${{ matrix.arch }}.msix" -File)
          if ($msix.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.arch }} .msix in dist/msix, found $($msix.Count)"
          }
          $hash = (Get-FileHash -LiteralPath $msix[0].FullName -Algorithm SHA256).Hash
          Write-Output "::notice::identity arch=$($x.Package.Identity.ProcessorArchitecture) name=$($x.Package.Identity.Name) publisher=$($x.Package.Identity.Publisher) version=$($x.Package.Identity.Version) display=$($x.Package.Properties.PublisherDisplayName) msix_sha256=$hash"

      - name: Upload MSIX Package Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: GreenC-MSIX-${{ matrix.arch }}
          path: |
            dist/msix/GreenC-*-${{ matrix.arch }}.msix
            dist/msix/wack-report-${{ matrix.arch }}.xml
          if-no-files-found: error

  bundle-msix:
    name: Bundle Microsoft Store MSIX (x64 + arm64)
    needs: build-msix
    if: needs.build-msix.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download x64 MSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: GreenC-MSIX-x64
          path: dist/msix/inputs/x64

      - name: Download Arm64 MSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: GreenC-MSIX-arm64
          path: dist/msix/inputs/arm64

      - name: Build & Verify MSIX Bundle and Store Upload
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ver = "${{ inputs.msix_version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -and "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          $params = @{
            InputDir  = "dist/msix/inputs"
            OutputDir = "dist/msix/bundle"
          }
          if (-not [string]::IsNullOrWhiteSpace($ver)) {
            $params.Version = $ver
          }
          & packaging/msix/build-bundle.ps1 @params

      - name: Report Store Bundle Upload
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $bundle = @(Get-ChildItem -Path dist/msix/bundle -Filter "GreenC-*.msixbundle" -File)
          $upload = @(Get-ChildItem -Path dist/msix/bundle -Filter "GreenC-*.msixupload" -File)
          if ($bundle.Count -ne 1 -or $upload.Count -ne 1) {
            throw "Expected exactly one .msixbundle and one .msixupload in dist/msix/bundle, found bundle=$($bundle.Count) upload=$($upload.Count)"
          }
          $bundleHash = (Get-FileHash -LiteralPath $bundle[0].FullName -Algorithm SHA256).Hash
          $uploadHash = (Get-FileHash -LiteralPath $upload[0].FullName -Algorithm SHA256).Hash
          Write-Output "::notice::store bundle=$($bundle[0].Name) bundle_sha256=$bundleHash upload=$($upload[0].Name) upload_sha256=$uploadHash"

      - name: Upload MSIX Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenC-MSIX-Store
          path: |
            dist/msix/bundle/GreenC-*.msixbundle
            dist/msix/bundle/GreenC-*.msixupload
          if-no-files-found: error

  smoke-bundle:
    name: Smoke-Test Store Bundle (${{ matrix.arch }})
    needs: bundle-msix
    if: needs.bundle-msix.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Store Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: GreenC-MSIX-Store
          path: dist/msix/bundle

      - name: Install and smoke-test the bundle (${{ matrix.arch }}, self-signed, throwaway runner)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -Path dist/msix/bundle -Filter "GreenC-*.msixbundle" -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one .msixbundle in dist/msix/bundle, found $($bundles.Count)"
          }
          & packaging/msix/smoke-test.ps1 -PackagePath $bundles[0].FullName -ExpectedArchitecture "${{ matrix.arch }}"

  release-windows:
    name: Build Windows Installer Release
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm --dir ui install --no-frozen-lockfile

      - name: Build Frontend Assets
        run: pnpm --dir ui run build

      - name: Build Desktop Application (Tauri v2)
        run: cargo build --release -p greenc-app -p greenc-cli

      - name: Stage Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/GreenC | Out-Null
          Copy-Item -Path target/release/greenc-app.exe -Destination dist/GreenC/GreenC.exe -Force
          Copy-Item -Path target/release/greenc-cli.exe -Destination dist/GreenC/greenc-cli.exe -Force

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $candidate) {
              $isccPath = $candidate
            } else {
              choco install innosetup -y
              $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          } else {
            $isccPath = $iscc.Source
          }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $isccPath "/DAppVersion=$ver" packaging/greenc.iss

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenC-Windows-Installer
          path: dist/GreenC-Setup-*.exe

  release-macos:
    name: Build macOS DMG Release (Ad-Hoc Signed)
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm --dir ui install --no-frozen-lockfile

      - name: Build Frontend Assets
        run: pnpm --dir ui run build

      - name: Build macOS CLI Binary
        run: cargo build --release -p greenc-cli

      - name: Build macOS DMG Bundle (Tauri v2)
        working-directory: crates/greenc-app
        run: npx -y -p @tauri-apps/cli@2 tauri build --ci --config '{"build":{"beforeBuildCommand":""}}' --bundles dmg

      - name: Stage Canonical macOS Release File
        run: |
          mkdir -p dist-macos
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n 1)
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$DMG" "dist-macos/GreenC-${VERSION}-macOS.dmg"
          cp target/release/greenc-cli "dist-macos/greenc-cli-macos"

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenC-macOS-DMG
          path: dist-macos/*

  release-linux:
    name: Build Linux DEB & AppImage Release
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm --dir ui install --no-frozen-lockfile

      - name: Build Frontend Assets
        run: pnpm --dir ui run build

      - name: Build Linux CLI Binary
        run: cargo build --release -p greenc-cli

      - name: Build Linux DEB & AppImage Bundles (Tauri v2)
        working-directory: crates/greenc-app
        env:
          NO_STRIP: "true"
        run: npx -y -p @tauri-apps/cli@2 tauri build --ci --config '{"build":{"beforeBuildCommand":""}}' --bundles deb,appimage

      - name: Stage Canonical Linux Release Files
        run: |
          mkdir -p dist-linux
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(ls target/release/bundle/deb/*.deb | head -n 1)
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          cp "$DEB" "dist-linux/GreenC-${VERSION}-Linux.deb"
          cp "$APPIMG" "dist-linux/GreenC-${VERSION}-Linux.AppImage"
          cp target/release/greenc-cli "dist-linux/greenc-cli-linux"

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenC-Linux-Packages
          path: dist-linux/*

  publish-release:
    name: Publish GitHub Release (Windows, macOS, Linux)
    needs: [release-windows, release-macos, release-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Generate SHA256 Checksums & Release Notes Header
        env:
          WINGET_ENABLED: ${{ vars.WINGET_ENABLED }}
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Install"
            echo
            if [ "$WINGET_ENABLED" = "true" ]; then
              echo '- **Windows (recommended):** `winget install CungChat.GreenC`'
            fi
            echo "- **Windows installer:** \`GreenC-Setup-${VERSION}.exe\` (per-user, no admin rights)"
            echo
            echo "> **Windows SmartScreen:** the installer is not code-signed yet (signing via SignPath Foundation is in progress),"
            echo "> so Windows may show *\"Windows protected your PC\"*. Click **More info → Run anyway**."
            if [ "$WINGET_ENABLED" = "true" ]; then
              echo "> Installing through \`winget\` does not trigger this prompt."
            fi
            echo
            echo "### SHA256 checksums"
            echo
            echo "Verify in PowerShell: \`Get-FileHash .\\GreenC-Setup-${VERSION}.exe -Algorithm SHA256\`"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../release-header.md
          cat ../release-header.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-header.md
          generate_release_notes: true
          files: release-assets/*

  publish-winget:
    name: Submit New Version to winget-pkgs
    needs: publish-release
    # Enable after the first manual submission (packaging/winget/) is merged into microsoft/winget-pkgs:
    #   Settings → Variables → WINGET_ENABLED=true, Secrets → WINGET_TOKEN (classic PAT, public_repo scope)
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINGET_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: CungChat.GreenC
          installers-regex: 'GreenC-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
