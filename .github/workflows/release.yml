name: Release

# Push a tag created by `scripts/version.py bump ... --commit --tag`, e.g. v2.1.0.
# The workflow builds the installer and attaches it to a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (uv run python scripts/version.py show).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (uv run python scripts/version.py show).Trim()
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          Set-Content release-notes.md $match.Groups[1].Value.Trim() -Encoding utf8
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: GreenC-Setup-${{ env.VERSION }}
          path: dist/GreenC-Setup-*.exe*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Green C:\ ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/GreenC-Setup-${{ env.VERSION }}.exe
            dist/GreenC-Setup-${{ env.VERSION }}.exe.sha256
