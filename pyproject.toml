[project]
name = "diskguard"
version = "0.1.0"
description = "Windows Desktop Disk Usage Tracker, Process/Service Attribution & Safe Rolling Quota Manager (with Zalo & DingTalk Smart Support)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "psutil>=6.0.0",
    "watchdog>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

