[project]
name = "greenc"
version = "2.0.0"
description = "Green C:\\ - keeps the Windows system drive free by cleaning and relocating app data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "psutil>=6.0.0",
    "watchdog>=4.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

